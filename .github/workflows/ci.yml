name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Each system reports on its own, so one failing doesn't hide the others (NFR-19).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            timeout: 15
          # GitHub can take a while to assign a macOS machine, and that wait counts toward the
          # job's limit, so it's longer here; the test steps below keep their own limits.
          - os: macos-latest
            timeout: 45
          - os: ubuntu-latest
            timeout: 10
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token isn't left in .git/config while dependencies' scripts run.
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
        timeout-minutes: 15
      - run: pnpm build
      - name: Install Playwright's browser
        run: pnpm exec playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
      - run: pnpm exec playwright test
        timeout-minutes: 15

  # The single check `main` requires: it passes only when every system passed (NFR-19).
  check:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every system passed
        run: test "${{ needs.test.result }}" = "success"
