version: 2
updates:
  # Keeps CI's pinned actions current, through pull requests that CI checks (PU-4).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Keeps the project's own dependencies current, through pull requests that CI checks.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The project targets Node 24, so its types stay on 24.x (owner's choice, 0.4.0).
      - dependency-name: "@types/node"
        versions: [">=25"]
